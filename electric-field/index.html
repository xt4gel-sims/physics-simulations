	fld(x, y) {
		let Ex = 0
		let Ey = 0
		let U = 0
		let dUdx = 0
		for (let i = 0; i < this.charges.length; i++) {
			let c = this.charges[i]
			let dx = x - c.x
			let dy = y - c.y
			let r2 = dx * dx + dy * dy
			let r = Math.sqrt(r2)
			let E = (2 * c.q) / r // These are really charged rods in 2d space, not point charges in 3d

			// let E = c.q/r;
			Ex += (dx / r) * E
			Ey += (dy / r) * E
			// U += c.q/r;
			U += -2 * c.q * Math.log(r) // Potential near a charged rod; arbitrary scale.
		}
		let E2 = Ex * Ex + Ey * Ey
		let E = Math.sqrt(E2)
		let ret = {
			x: x,
			y: y,
			U: U,
			E: E,
			Ex: Ex,
			Ey: Ey,
			gx: Ex / E,
			gy: Ey / E, // Field direction vector
		}
		// console.log("Field at "+x+","+y,ret);
		return ret
	}
	collisionFind(x, y, tol = -0.0001) {
		for (let i = 0; i < this.charges.length; i++) {
			let c = this.charges[i]
			let dx = x - c.x
			let dy = y - c.y
			let r2 = dx * dx + dy * dy
			let cr = c.r + tol
			if (r2 < cr * cr) {
				// console.log("collision",dx,dy,r2,cr*cr);
				return c
			}
		}
		return null
	}
	nodePositionFind(charge) {
		// If this is a virgin charge. Find seed positions.
		if (charge.nodes.length == 0 && charge.nodesNeeded.length == 0) {
			this.SeedNodes(charge, 0)
		}

		// See if there are some precomputed positions to try.
		if (charge.nodesNeeded && charge.nodesNeeded.length > 0) {
			let t = charge.nodesNeeded.shift()
			charge.nodes.push(t)
			return t
		}

		charge.nodes.sort()
		// bifurcate biggest arc
		let biggest_gap = 0
		let gap_after = 0
		for (let i = 0; i < charge.nodes.length; i++) {
			let t1 = charge.nodes[i]
			let t2
			if (i + 1 < charge.nodes.length) t2 = charge.nodes[i + 1]
			else t2 = charge.nodes[(i + 1) % charge.nodes.length] + TWO_PI // wrap around
			let dt = Math.abs(t2 - t1)
			// console.log(i,t1,t2,dt);
			if (dt > biggest_gap) {
				gap_after = i
				biggest_gap = dt
			}
		}
		let new_node = (charge.nodes[gap_after] + biggest_gap * 0.5) % TWO_PI
		charge.nodes.push(new_node)
		return new_node
	}
	positionOfUFind(input, Utarget, Utolerance) {
		// Takes an input object: {E: E{E,U,x,y}, x, y}}
		// Returns a similar output object at the best guess for Utarget.
		// Follows the field line at point input.x,input.y until it converges on the Utarget
		// We know that U = - delE
		// so by newton-raphson method...
		// distance to go along field line = (U1 - Utarget) / E
		let out = input
		let it = 0
		while (Math.abs(out.U - Utarget) > Utolerance) {
			it++
			let delta = (out.U - Utarget) / out.E
			let x = out.x + delta * out.gx
			let y = out.y + delta * out.gy
			if (isNaN(x) || isNaN(y)) debugger
			out = this.fld(x, y)
		}
		// console.log("converge in ", it, "Accuracy: ",out.E.U - Utarget);
		return out
	}

	collisionDo(collide, x, y) {
		// console.warn("collided with charge that has ",collide.nodesNeeded.length,"left ")
		let dx = x - collide.x
		let dy = y - collide.y
		let angle = (Math.atan2(dy, dx) + TWO_PI) % TWO_PI

		collide.nodes.push(angle)
		collide.nodesUsed.push(angle)

		if (collide.nodesUsed.length == 1) {
			// This is the first line to collide. Seed other positions around this.
			this.SeedNodes(collide, angle)
		}

		let best = 0
		let bestdiff = 9e9
		for (let k = 0; k < collide.nodesNeeded.length; k++) {
			let diff = Math.abs((collide.nodesNeeded[k] - angle) % (2 * Math.PI))
			if (diff < bestdiff) {
				bestdiff = diff
				best = k
			}
		}
		collide.nodesNeeded.splice(best, 1)
	}
	fieldLineTrace(fieldline) {
		//console.log(fieldline);
		let x = fieldline.start_x
		let y = fieldline.start_y

		fieldline.points = [{ x: x, y: y }]
		let lastE = this.fld(x, y)

		let traceFinished = false
		let nstep = 0
		let dist = 0
		while (true) {
			nstep++
			let E = this.fld(x, y)
			let h = step * fieldline.dir // step size.

			// version 1: Euler.
			if (this.estMode == 1) {
				let dx = E.gx * h
				let dy = E.gy * h
				x += dx
				y += dy
				dist += h
			} else {
				// if(this.estMode==4)
				// version 2: Runga-kutta 4th order.
				h = h * 2 // RK savings mean larger step sizes.
				let E2 = this.fld(x + (E.gx * h) / 2, y + (E.gy * h) / 2)
				let E3 = this.fld(x + (E2.gx * h) / 2, y + (E2.gy * h) / 2)
				let E4 = this.fld(x + E3.gx * h, y + E3.gy * h)
				let dx = ((E.gx + E2.gx * 2 + E3.gx * 2 + E4.gx) * h) / 6
				let dy = ((E.gy + E2.gy * 2 + E3.gy * 2 + E4.gy) * h) / 6
				x += dx
				y += dy
				dist += Math.sqrt(dx * dx + dy * dy)
				let theta = ((Math.atan2(dy, dx) % (2 * Math.PI)) * 180) / Math.PI // polar angle direction of RK
				let theta2 = ((Math.atan2(E.gy * h, E.gx * h) % (2 * Math.PI)) * 180) / Math.PI // ditto euler

				// console.error(theta-theta2);
				// note that this may not be exactly length h, but who cares?
			}
			// Fixme adapative euler!
			// Parasitic calculation. Find line segments that cross equipotential lines.
			// FIXME: I could do this seperately by simply following a line that is perp to E (clockwise). Doesn't work in 3d.
			// if(this.equiPotQ)
			if (!fieldline.startCharge || dist > fieldline.startCharge.r) {
				let span = SpansIntegerMultiple(lastE.U, E.U, potential_multiple)
				if (span != null) {
					let pnode = { U: span * potential_multiple, E1: lastE, E2: E }
					this.potentialnodes.push(pnode)
				}
			}

			fieldline.points.push({ x: x, y: y })
			lastE = E

			let collide = this.collisionFind(x, y)
			if (collide && fieldline.dir * collide.q < 0 && nstep > 1) {
				// Find the best possible node for this line.
				if (collide.nodesUsed.length > collide.n_nodes) {
					// Comment these lines out if you want it to just sail through without stopping...
					// console.warn('Line failed - hit q=', collide, 'which has no nodes left.')
					return false //nodeFinished=false;
				} else {
					this.collisionDo(collide, x, y)
					fieldline.endCharge = collide
					fieldline.nstep = nstep
					//console.log("Line succeeded - hit q=",collide.q);
					return true // nodeFinished
				}
			}

			if (nstep > max_steps) {
				fieldline.endCharge = null
				fieldline.endAngle = null
				fieldline.endNodeAngle = null
				fieldline.nstep = nstep
				//console.log('Line succeeded - no hit')
				return true
			} // if nstep
		} // trace loop
	}
	fieldLinesFind() {
		this.fieldLines = []
		this.potentialnodes = []
		this.equipotential_lines = []

		let total_charge = 0
		let max_x = -1e20
		let min_x = 1e20
		let max_y = -1e20
		let min_y = 1e20
		let max
		for (let i = 0; i < this.charges.length; i++) {
			let charge = this.charges[i]
			total_charge += charge.q
			charge.r = 0.12 * Math.sqrt(Math.abs(charge.q))
			charge.n_nodes = Math.round(Math.abs(source_lines_per_unit_charge * charge.q))
			charge.nodes = [] // All successful or unsuccesful nodes
			charge.nodesUsed = [] // Nodes that have actually worked.
			charge.nodesNeeded = [] // Some idea what nodes we should try.
			if (charge.x > max_x) max_x = charge.x
			if (charge.x < min_x) min_x = charge.x
			if (charge.y > max_y) max_y = charge.y
			if (charge.y < min_y) min_y = charge.y
		}

		// rank them. Use minority charge carriers first: their nodes HAVE to connect.
		this.charges.sort(chargesort)
		if (total_charge < 0) this.charges.reverse()

		// console.log('Doing escaping lines -------- ')
		// Find fieldlines that come from outside the area, assuming there is a majority charge carrier.
		let escaping_lines = Math.abs(total_charge * source_lines_per_unit_charge)
		for (let i = 0; i < escaping_lines; i++) {
			//console.log("Doing escaping line.");
			// Find a position very far away from the charges.
			let r = Math.max(this.xmax, this.ymax) * 10
			if (isNaN(r)) r = 10
			let theta = (i * 2 * 3.14159) / escaping_lines
			let x = r * Math.cos(theta)
			let y = r * Math.sin(theta)

			let fieldline = { startCharge: null }
			if (total_charge > 0) fieldline.dir = -1
			else fieldline.dir = 1
			fieldline.start_x = x
			fieldline.start_y = y
			fieldline.start = 'outside'
			let nodeFinished = this.fieldLineTrace(fieldline)
			if (nodeFinished) {
				this.fieldLines.push(fieldline)
			} else {
				// console.log('incoming line failed')
			}
		}

		// Now loop through again, finding unused nodes and tracing field lines from those
		// nodes until they either hit another charge or they require too many computational cycles.
		for (let i = 0; i < this.charges.length; i++) {
			let random_seed = 0
			let charge = this.charges[i]
			// console.log("Find field lines for charge ",i," with charge ",charge.q);
			this.ctx.fillStyle = 'blue'
			//console.log('Doing charge', i, 'with q=', charge.q, 'which has ', charge.nodesUsed.length, '/', charge.n_nodes, ' nodes')

			while (charge.nodesUsed.length < charge.n_nodes && charge.nodes.length < source_lines_per_unit_charge * 5) {
				if (charge.nodes.length > source_lines_per_unit_charge * 4) {
					console.warn('Wow! Tried way too many nodes.', charge.nodes)
				}
				//console.log("Doing node on charge",i,charge,charge.nodesUsed.length);
				let start_angle = this.nodePositionFind(charge)

				let r = charge.r
				// Boost in initial direction by radius.
				let fieldline = { startCharge: charge }
				fieldline.start = 'charge'
				let nodeFinished = false

				// console.log("Try: ",nodeTries,"Trying angle:",start_angle*180/Math.PI,nodeTries);
				fieldline.start_x = charge.x + charge.r * Math.cos(start_angle)
				fieldline.start_y = charge.y + charge.r * Math.sin(start_angle)
				fieldline.start_angle = start_angle
				let dir = 1
				if (charge.q < 0) dir = -1
				fieldline.dir = dir

				nodeFinished = this.fieldLineTrace(fieldline)
				if (nodeFinished) {
					this.fieldLines.push(fieldline)
					charge.nodesUsed.push(start_angle)
				}
			} // nodeFinished
		}

		if (this.equiPotQ) {
			// Find equipotential lines.
			// Trace around all the equpotenial nodes we've found.
			///
			/// Thoughts for next revision
			///
			/// Time is taken looking for intersections, and lines failing to close.
			/// A line starts, misses some nodes (which spawns more line traces) OR it fails to close and loops.
			///
			/// 1) Find unique lines.
			///   Find just one line running beteween each charge (1-2, 2-3, 1-3 etc)  Locate equipotential nodes.
			///   Include a line from charge to 'outside' if there is one.
			///  That still has redundancies, but it's a more limited set of nodes to check.
			/// 2) When tracing, keep track of angle between line segment and every charge point
			///    theta_tot += delta_theta,  where delta_theta is the angle subtended by a step relative to that charge.
			///    If a line reaches theta_tot ~= 2pi for one or more charges, and ~2*n*pifor the others, we've completed a loop.
			///    Alternatively, just check distance to the original point is small (and is less than some arbitrary max)
			///    This is faster and will stop over-looping
			/// 3) Make sure we're > radius to each other charge
			/// 4) Try adaptive step-size, with RK or otherwise, so that step-size is adjusted on every go.
			// console.log('looking at potentialnodes: ', this.potentialnodes.length)
			this.potentialnodes.sort(function (a, b) {
				return a.U - b.U
			})
			while (this.potentialnodes.length > 0) {
				let pnode = this.potentialnodes.shift()
				// console.log(pnode)
				let Utarget = pnode.U
				// Fresh node. Approximate the point of best potential.
				// console.log("Trying node, Utarget=",Utarget);
				let E = this.positionOfUFind(pnode.E1, Utarget, Utolerance)
				// console.log('E position of U', E)

				let xstart = E.x
				let ystart = E.y
				// let fU = (pnode.U - pnode.E1.U)/(pnode.E2.U-pnode.E1.U);
				// if(pnode.E2.U < pnode.E1.U) fU = -fU;
				// let startx = pnode.x1 + fU*(pnode.x2-pnode.x1);
				// let starty = pnode.y1 + fU*(pnode.y2-pnode.y1);
				// let startE = this.fld(startx,starty);
				// Start tracing this equpotential back and forth.
				for (let dir = -1; dir < 3; dir += 2) {
					let line = { U: Utarget, points: [{ x: E.x, y: E.y }] }
					let done = false
					// console.log("start line at",startE.U,pnode.U,pnode);
					let np = 0
					while (!done) {
						np++
						// console.log(point);
						// version 1: Euler.
						let newx = 0,
							newy = 0
						if (this.estMode == 1) {
							let h = step_equi * dir
							newx = E.x + E.gy * h // Not a typo. .
							newy = E.y - E.gx * h // We're going perpendicular to the field!
						} else {
							// if(this.estMode==4)
							// version 2: Runga-kutta 4th order.
							let h = step_equi * 3 * dir // rk is betterer
							let E2 = this.fld(E.x + (E.gy * h) / 2, E.y - (E.gx * h) / 2)
							let E3 = this.fld(E.x + (E2.gy * h) / 2, E.y - (E2.gx * h) / 2)
							let E4 = this.fld(E.x + E3.gy * h, E.y - E3.gx * h)
							newx = E.x + ((E.gy + E2.gy * 2 + E3.gy * 2 + E4.gy) * h) / 6
							newy = E.y - ((E.gx + E2.gx * 2 + E3.gx * 2 + E4.gx) * h) / 6
						}
						let next_point = this.fld(newx, newy)
						// RK is good enough we don't need to refine!
						// let next_point = this.positionOfUFind(next_point,Utarget,Utolerance); // refine
						// Check for intersection with other potentialnodes. Delete them as we go.
						for (let i = 0; i < this.potentialnodes.length; i++) {
							let othernode = this.potentialnodes[i]
							if (othernode.U == Utarget) {
								if (LineSegmentsIntersect(E, next_point, othernode.E1, othernode.E2)) {
									// console.warn("collide with node!  left:",this.potentialnodes.length);
									this.potentialnodes.splice(i, 1)
									i-- // need to decrement counter after removing.
								}
							} else break // if list is sorted, should U should match.
						}
						// let d2 = (next_point.x - xstart)*(next_point.x - xstart)+(next_point.y - ystart)*(next_point.y - ystart);
						// console.log("distance from start: ",Math.sqrt(d2));
						if (np > 2 && LineSegmentsIntersect(E, next_point, pnode.E1, pnode.E2)) {
							done = true
							dir = 3 // exit dir loop
							// console.warn('looped equipotential line')
						} else if (np > max_equi_step) {
							// console.warn('gave up on equipotential line')
							done = true
						}
						line.points.push({ x: next_point.x, y: next_point.y })
						E = next_point
						// console.log(E.U);
					}
					this.equipotential_lines.push(line)
					// console.log("End U",Utarget,"at",E);
				}
				// break;
			}
		}
	}

	TotalEnergy() {
		let tot = 0
		for (let i = 1; i < this.charges.length; i++) {
			for (let j = 0; j < i; j++) {
				// compute potential at this point for all other charges.
				let ci = this.charges[i]
				let cj = this.charges[j]

				let dx = ci.x - cj.x
				let dy = ci.y - cj.y
				let r2 = dx * dx + dy * dy
				let r = Math.sqrt(r2)
				tot += (2 * ci.q * 2 * cj.q) / r // using 3d pointlike potential

				// tot += 2*ci.q*2*cj.q*Math.log(1/r); // using line charges
			}
		}
		return tot
	}
	draw() {
		my.can.clear()
		this.ctx.save()

		this.equiPotQ = document.getElementById('ctl-do-eqipotential').checked

		this.canvas_translate = { x: this.can.wd / 2, y: this.can.ht / 2 }

		this.ctx.translate(this.canvas_translate.x, this.canvas_translate.y)
		this.xmin = -this.width_x / 2
		this.xmax = this.width_x / 2
		this.ymin = ((-this.width_x / 2) * this.can.ht) / this.can.wd
		this.ymax = ((this.width_x / 2) * this.can.ht) / this.can.wd

		this.ctx.strokeStyle = 'blue'
		this.ctx.fillStyle = 'white'
		this.ctx.lineWidth = 0.5
		this.ctx.beginPath()
		this.ctx.rect(-this.canvas_translate.x, -this.canvas_translate.y, this.can.wd, this.can.ht)
		this.ctx.stroke()
		this.ctx.fill()
		this.ctx.beginPath()

		let urlparams = ''
		for (let i = 0; i < this.charges.length; i++) {
			if (i == 0) urlparams += '?'
			else urlparams += '&'
			urlparams += 'q' + i + '='
			urlparams += this.charges[i].q + ',' + parseFloat(this.charges[i].x.toFixed(3)) + ',' + parseFloat(this.charges[i].y.toFixed(3))
			if (hide_charge_values) urlparams += '&hideq=1'
			urlparams += '&lines=' + source_lines_per_unit_charge
		}

		document.getElementById('totalenergy').innerHTML = 'Συνολική Ενέργεια: ' + this.TotalEnergy().toFixed(1)

		this.fieldLinesFind()

		this.fieldLinesDraw()
		this.drawCharges()
		if (this.equiPotQ) this.drawEquipotentialLines()

		this.ctx.restore()
	}
	fieldLinesDraw() {
		// console.time('drawing lines')
		this.ctx.lineWidth = 1
		for (let i = 0; i < this.fieldLines.length; i++) {
			let line = this.fieldLines[i]
			//console.log("drawing line ",i);
			this.ctx.strokeStyle = 'black'

			this.ctx.beginPath()
			this.ctx.lineJoin = 'round'
			this.ctx.moveTo(line.start_x * this.scale, line.start_y * this.scale)
			for (let j = 1; j < line.points.length; j++) {
				let p = line.points[j]
				this.ctx.lineTo(p.x * this.scale, p.y * this.scale)
			}
			this.ctx.stroke()

			let n = line.points.length
			// Add arrow. Find the midway point along the line.
			let j = Math.round((n - 1) / 2)
			// console.log(j,line.points.length);
			let x = line.points[j].x
			let y = line.points[j].y
			// Ensure arrow is on the screen - keep halving the midway point until we reach it.
			while (x < this.xmin || x > this.xmax || y < this.ymin || y > this.ymax) {
				if (line.start == 'outside') j = Math.round(n - (n - j) / 2)
				else j = Math.round(j / 2)
				x = line.points[j].x
				y = line.points[j].y
				//console.log(j);
				if (j <= 1 || j >= n - 3) break
			}
			let dx = line.dir * (line.points[j + 1].x - x)
			let dy = line.dir * (line.points[j + 1].y - y)

			this.ctx.fillStyle = 'black'

			this.ctx.beginPath()

			let angle = (Math.atan2(-dy, dx) + TWO_PI) % TWO_PI
			this.ctx.drawArrow(x * this.scale, y * this.scale, 2, 1, 20, 10, angle, 5)
			// (x0, y0, totLen, shaftHt, headLen, headHt, angle, sweep, invertQ)
			this.ctx.stroke()
			this.ctx.fill()
		}
	}
	drawEquipotentialLines() {
		console.time('drawing potential lines')
		this.ctx.lineWidth = 2
		this.ctx.strokeStyle = 'green'
		this.ctx.lineJoin = 'round'
		for (let i = 0; i < this.equipotential_lines.length; i++) {
			let line = this.equipotential_lines[i]

			this.ctx.beginPath()
			// this.ctx.moveTo(line.points[0].x * this.scale, line.points[0].y * this.scale)
			for (let j = 0; j < line.points.length; j++) {
				let p = line.points[j]
				if (j == 0) {
					this.ctx.moveTo(p.x * this.scale, p.y * this.scale)
				} else {
					this.ctx.lineTo(p.x * this.scale, p.y * this.scale)
				}
			}
			this.ctx.stroke()
		}
	}
	drawCharges() {
		// draw charges. Do this last so line tails are covered.

		this.ctx.textBaseline = 'middle'
		this.ctx.textAlign = 'center'
		this.ctx.font = '12pt sans-serif'

		for (let i = 0; i < this.charges.length; i++) {
			let charge = this.charges[i]

			this.ctx.fillStyle = charge.q > 0 ? 'red' : 'blue'
			this.ctx.strokeStyle = 'black'
			this.ctx.lineWidth = charge.highlight ? 3 : 1

			let x = charge.x * this.scale
			let y = charge.y * this.scale
			let r = charge.r
			//console.log(charge.x,charge.y,charge.r,0,Math.PI*2,true);
			this.ctx.beginPath()
			this.ctx.arc(x, y, r * this.scale, 0, Math.PI * 2, true)
			this.ctx.fill()
			this.ctx.stroke()

			// draw text
			this.ctx.fillStyle = 'white'
			this.ctx.strokeStyle = 'white'
			this.ctx.lineWidth = 1

			let s
			if (charge.q < 0) s = '-'
			else s = '+'
			s += parseInt(Math.abs(charge.q))
			if (!hide_charge_values) this.ctx.fillText(s, x, y)
		}
	}
	getEventXY(ev) {
		// Convert mouse click coordinates to the mathematical plane.
		let offset = getAbsolutePosition(this.can.el)
		let x = ev.pageX
		let y = ev.pageY

		if (ev.type == 'touchstart' || ev.type == 'touchmove' || ev.type == 'touchend') {
			ev.preventDefault()
			x = ev.originalEvent.touches[0].pageX
			y = ev.originalEvent.touches[0].pageY
		}
		x = x - offset.x
		y = y - offset.y
		x -= this.canvas_translate.x
		y -= this.canvas_translate.y

		return { x: x, y: y }
	}
	mouseDo(ev) {
		let xy = this.getEventXY(ev)
		let x = xy.x / this.scale
		let y = xy.y / this.scale

		let update = false

		if (ev.type === 'mousedown' || ev.type === 'touchstart') {
			// See if we're clicking a charge.
			let charge = this.collisionFind(x, y)
			if (charge) {
				this.dragging = true
				this.charge_dragged = charge
				charge.highlight = true
				update = true
			}
		}
		if (ev.type === 'mousemove' || ev.type === 'touchmove') {
			my.can2.clear()
			if (this.dragging) {
				this.charge_dragged.x = x
				this.charge_dragged.y = y
				update = true
			} else {
				let f = this.fld(x, y)

				let charge = this.collisionFind(x, y,0.02)
				if (charge) {
					// too close to charge don't show
				} else {
					// show force arrow with magnitude and angle!

					let mid = { x: x * this.scale + this.canvas_translate.x, y: y * this.scale + this.canvas_translate.y }
					let inc = { x: f.Ex * 5, y: f.Ey * 5 }
					// let angle = 0
					let angle = (Math.atan2(-inc.y, inc.x) + TWO_PI) % TWO_PI

					my.can2.clear()
					let g = my.can2.g

					
					g.fillStyle = 'red'
					g.beginPath()
					g.arc(mid.x, mid.y,4,0,TWO_PI)
					g.fill()
					
					g.lineWidth = 1.5
					g.strokeStyle = 'red'
					g.beginPath()
					g.moveTo(mid.x - inc.x, mid.y - inc.y)
					g.lineTo(mid.x + inc.x, mid.y + inc.y)
					g.drawArrow(mid.x + inc.x, mid.y + inc.y, 2, 1, 20, 10, angle, 5)
					
					g.stroke()
					g.fill()
				}
			}
		}
		if (ev.type === 'mouseup' || ev.type === 'touchend') {
			if (this.charge_dragged) this.charge_dragged.highlight = false
			this.charge_dragged = null
			this.dragging = false
			update = true
		}

		if (ev.type === 'mouseout') {
			if (this.charge_dragged) {
				// find it in the list.
				let which = 0
				for (let i = 0; i < this.charges.length; i++) if (this.charge_dragged == this.charges[i]) which = i
				this.charges.splice(which, 1)
				this.charge_dragged = false
				this.dragging = false
				update = true
			}
		}

		if (update) this.draw()
	}

	printHQ() {
		// First, save our current state.
		let saveCanvas = this.canvas
		let saveCtx = this.ctx
		let saveWidth = this.width
		let saveHeight = this.height

		let gPrintScale = 1
		// Second, create an offscreen drawing context.
		let canvas = document.createElement('canvas')
		this.canvas = canvas
		canvas.width = saveWidth * gPrintScale
		canvas.height = saveHeight * gPrintScale
		// this.width  = saveWidth * gPrintScale;
		// this.height = saveHeight * gPrintScale;
		this.ctx = this.canvas.getContext('2d')

		// Now do the actual draw
		this.ctx.scale(gPrintScale, gPrintScale)
		this.draw()

		// Save the print result
		let gPrintBuffer = this.canvas.toDataURL('image/png')

		// Restore defaults.
		this.canvas = saveCanvas
		this.ctx = saveCtx
	}

function chargesort(a, b) {
	let cmp = a.q - b.q
	if (cmp == 0) cmp = a.y - b.y
	return cmp
}

function SpansIntegerMultiple(a, b, r) {
	// Does (a,b) span an a value that is an integer multiple of r?
	let da = Math.floor(a / r)
	let db = Math.floor(b / r)
	if (da == db) return null
	return Math.max(da, db)
}
function PointTripletOrientation(p, q, r) {
	// From http://www.geeksforgeeks.org/check-if-two-given-line-segments-intersect/
	// See 10th slides from following link for derivation of the formula
	// http://www.dcs.gla.ac.uk/~pat/52233/slides/Geometry1x1.pdf
	let val = (q.y - p.y) * (r.x - q.x) - (q.x - p.x) * (r.y - q.y)

	if (val == 0) return 0 // colinear

	return val > 0 ? 1 : 2 // clock or counterclock wise
}

function PointOnSegment(p, q, r) {
	if (q.x <= Math.max(p.x, r.x) && q.x >= Math.min(p.x, r.x) && q.y <= Math.max(p.y, r.y) && q.y >= Math.min(p.y, r.y)) return true

	return false
}

function LineSegmentsIntersect(
	p1,
	q1, // first line segment points
	p2,
	q2 // second line segment points
) {
	// From http://www.geeksforgeeks.org/check-if-two-given-line-segments-intersect/

	// Find the four orientations needed for general and
	// special cases
	let o1 = PointTripletOrientation(p1, q1, p2)
	let o2 = PointTripletOrientation(p1, q1, q2)
	let o3 = PointTripletOrientation(p1, p2, q2)
	let o4 = PointTripletOrientation(q1, p2, q2)

	let d2 = (q2.x - p1.x) * (q2.x - p1.x) + (q2.y - p1.y) * (q2.y - p1.y)
	// console.log("Check for intersection",o1,o2,o3,o4,Math.sqrt(d2),p1,q1,p2,q2);
	// General case
	if (o1 != o2 && o3 != o4) return true

	// Not important to us; tested segments should always be nearly perpendicular
	// Special Cases: check for colinearity.
	// p1, q1 and p2 are colinear and p2 lies on segment p1q1
	// if (o1 == 0 && PointOnSegment(p1, p2, q1)) return true;
	//
	// // p1, q1 and p2 are colinear and q2 lies on segment p1q1
	// if (o2 == 0 && PointOnSegment(p1, q2, q1)) return true;
	//
	// // p2, q2 and p1 are colinear and p1 lies on segment p2q2
	// if (o3 == 0 && PointOnSegment(p2, p1, q2)) return true;
	//
	//  // p2, q2 and q1 are colinear and q1 lies on segment p2q2
	// if (o4 == 0 && PointOnSegment(p2, q1, q2)) return true;

	return false // Doesn't fall in any of the above cases
}

function getAbsolutePosition(element) {
	let r = { x: element.offsetLeft, y: element.offsetTop }
	if (element.offsetParent) {
		let tmp = getAbsolutePosition(element.offsetParent)
		r.x += tmp.x
		r.y += tmp.y
	}
	return r
}

CanvasRenderingContext2D.prototype.drawArrow = function (x0, y0, totLen, shaftHt, headLen, headHt, angle, sweep, invertQ) {
	let g = this

	// angle: 0 points right, Math.PI points left
	//console.log("drawArrow=" + totLen, headLen, headHt, angle);
	let pts = [
		[0, 0],
		[-headLen, -headHt / 2],
		[-headLen + sweep, -shaftHt / 2],
		[-totLen, -shaftHt / 2],
		[-totLen, shaftHt / 2],
		[-headLen + sweep, shaftHt / 2],
		[-headLen, headHt / 2],
		[0, 0],
	]

	for (let i in pts) {
		let pt = pts[i]
		pt[0] += headLen / 2
	}

	if (invertQ) {
		pts.push([0, -headHt / 2], [-totLen, -headHt / 2], [-totLen, headHt / 2], [0, headHt / 2])
	}
	for (let i = 0; i < pts.length; i++) {
		//let cosa = Math.cos(-angle * Math.PI / 180.);
		//let sina = Math.sin(-angle * Math.PI / 180.);
		let cosa = Math.cos(-angle)
		let sina = Math.sin(-angle)
		let xPos = pts[i][0] * cosa + pts[i][1] * sina
		let yPos = pts[i][0] * sina - pts[i][1] * cosa
		if (i == 0) {
			g.moveTo(x0 + xPos, y0 + yPos)
		} else {
			g.lineTo(x0 + xPos, y0 + yPos)
		}
	}
}

class Can {
	constructor(id, wd, ht, ratio) {
		this.ratio = ratio
		this.el = typeof id == 'string' ? document.getElementById(id) : id // id can be element
		this.g = this.el.getContext('2d')
		this.resize(wd, ht)
		return this
	}
	resize(wd, ht) {
		this.wd = wd
		this.ht = ht
		//this.el.style.border = "1px solid black";
		this.el.width = wd * this.ratio
		this.el.style.width = wd + 'px'
		this.el.height = ht * this.ratio
		this.el.style.height = ht + 'px'
		this.g.setTransform(this.ratio, 0, 0, this.ratio, 0, 0)
	}
	clear() {
		this.g.clearRect(0, 0, this.wd, this.ht)
	}
	mousePos(ev) {
		let bRect = this.el.getBoundingClientRect()
		let x = (ev.clientX - bRect.left) * (this.el.width / this.ratio / bRect.width)
		let y = (ev.clientY - bRect.top) * (this.el.height / this.ratio / bRect.height)
		return { x: x, y: y }
	}
}

function docInsert(s) {
	let div = document.createElement('div')
	div.innerHTML = s
	let script = document.currentScript
	script.parentElement.insertBefore(div, script) // Add the newly-created div before script location
}

function wrap({ id = '', cls = '', pos = 'rel', style = '', txt = '', tag = 'div', lbl = '', fn = '', opts = [] }, ...mores) {
	let s = ''
	s += '\n'

	txt += mores.join('')

	let noProp = 'event.stopPropagation(); '

	// prettier-ignore
	let tags = {
    btn:  {stt: '<button ' + (fn.length > 0 ? ' onclick="' + noProp + fn + '" ' : ''), cls:'btn', fin:'>' + txt + '</button>'},
    can:  {stt: '<canvas ', cls:'', fin:'></canvas>'},
    div:  {stt: '<div ' + (fn.length > 0 ? ' onclick="' + fn + '" ' : ''), cls:'', fin:' >' + txt + '</div>'},
    edit: {stt: '<textarea onkeyup="' + fn + '" onchange="' + fn + '"', cls:'', fin:' >' + txt + '</textarea>'},
    inp:  {stt: '<input value="' + txt + '"' + (fn.length > 0 ? '  oninput="' + fn + '" onchange="' + fn + '"' : ''), cls:'input', fin:'>' + (lbl.length > 0 ? '</label>' : '')},
    out:  {stt: '<span ', cls:'output', fin:' >' + txt + '</span>' + (lbl.length > 0 ? '</label>' : '')},
    radio:{stt:'<div ', cls:'radio', fin:'>\n'},
    sel:  {stt: '<select ' + (fn.length > 0 ? ' onchange="' + fn + '"' : ''), cls:'select', fin:'>\n'},
    sld:  {stt:'<input type="range" ' + txt + ' oninput="' + noProp + fn + '" onchange="'  + noProp + fn + '"', cls:'select', fin: '>' + (lbl.length > 0 ? '</label>' : '')},
  }

	let type = tags[tag]

	if (lbl.length > 0) s += '<label class="label">' + lbl + ' '

	s += type.stt
	if (cls.length == 0) cls = type.cls
	if (tag == 'div') style += fn.length > 0 ? ' cursor:pointer;' : ''

	if (id.length > 0) s += ' id="' + id + '"'
	if (cls.length > 0) s += ' class="' + cls + '"'
	if (pos == 'dib') s += ' style="position:relative; display:inline-block;' + style + '"'
	if (pos == 'rel') s += ' style="position:relative; ' + style + '"'
	if (pos == 'abs') s += ' style="position:absolute; ' + style + '"'

	// if (tag == 'sld') s += '>'
	s += type.fin

	if (tag == 'radio') {
		for (let i = 0; i < opts.length; i++) {
			let chk = ''
			if (i == 0) chk = 'checked'
			let idi = id + i
			let lbl = opts[i]
			s += '<input id="' + idi + '" type="radio" name="' + id + '" value="' + lbl.name + '" onclick="' + fn + '(' + i + ');" ' + chk + ' >'
			s += '<label for="' + idi + '">' + lbl.name + ' </label>'
		}
		s += '</div>'
	}
	if (tag == 'sel') {
		for (let i = 0; i < opts.length; i++) {
			let opt = opts[i]
			let idStr = id + i
			let chkStr = opt.name == txt ? ' selected ' : ''
			let descr = opt.hasOwnProperty('descr') ? opt.descr : opt.name
			s += '<option id="' + idStr + '" value="' + opt.name + '"' + chkStr + '>' + descr + '</option>\n'
		}
		s += '</select>'
		if (lbl.length > 0) s += '</label>'
	}

	s += '\n'
	// console.log('wrap', tag + '\n', s + '\n')

	return s.trim()
}
